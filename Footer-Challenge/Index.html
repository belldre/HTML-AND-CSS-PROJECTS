<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Footer Challenge</title>
    <!--BOOTSTRAP CSS-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <!--CUSTOM CSS listed last for overriding the BootStrap CSS based on level of specificity -->
    <link href="css/custom.css" rel="stylesheet">
</head>

<body>
    <main class="container py-5">
        <h1 class="mb-4">Welcome....</h1>
        <p>A great place holder for the time being!</p>
        <!--LIGHT TO DARK MODE TOGGLEMode-->
        <button id="themeToggle" class="btn btn-outline-secondary mt-3">
            <i class="bi bi-moon-fill"></i> Toggle Dark Mode
        </button>
    </main>

    <footer class="bg-dark text-light py-4">
        <div class="container">
            <div class="row">
                <!-- Contact Info -->
                <div class="col-md-4 mb-3">
                    <h5>Contact Us</h5>
                    <ul class="list-unstyled">
                        <li>Email: drebell@outlook.com</li>
                        <li>Phone: 971.284.9848</li>
                        <li>Address: 123 Main St, Camden, NJ 08104</li>
                    </ul>
                </div>

                <!--UN SET SOCIAL MEDIA LINKS-->
                <div class="col-md-4 mb-3">
                    <h5>Follow Us</h5>
                    <ul class="list-unstyled d-flex gap-3">
                        <li><a href="#" class="text-light text-decoration-none"><i class="bi bi-facebook"></i>
                                Facebook</a></li>
                        <li><a href="#" class="text-light text-decoration-none"><i class="bi bi-twitter"></i>
                                Twitter</a></li>
                        <li><a href="#" class="text-light text-decoration-none"><i class="bi bi-instagram"></i>
                                Instagram</a></li>
                    </ul>
                </div>

                <!--DRE BELL COPYRIGHT-->
                <div class="col-md-4 text-md-end">
                    <h5>© 2025 Dre Bell</h5>
                    <p class="mb-0">All rights reserved.</p>
                </div>
            </div>
        </div>
    </footer>

    <script>
        const toggleBtn = document.getElementById('themeToggle');
        const body = document.body;
        toggleBtn.addEventListener('click', () => {
            const isDark = body.classList.toggle('bg-dark');
            body.classList.toggle('text-light');
            body.classList.toggle('bg-light');
            body.classList.toggle('text-dark');
            toggleBtn.innerHTML = isDark
                ? '<i class="bi bi-sun-fill"></i> Toggle Light Mode'
                : '<i class="bi bi-moon-fill"></i> Toggle Dark Mode';
        });
    </script>
</body>

</html>
